# Theme Configuration
theme:
  name: material
  logo: img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    - scheme: default
      primary: green
      accent: yellow
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.code.copy

# Watch these files for changes to trigger a rebuild
watch:
  - docs
  - mkdocs.yml

# these are mostly image prompts and some README files that we don't want to include in the generated site
exclude_docs: |
  img/mascot/image-prompts.md
  prompts/create-logo-generator.md
  learning-graph/linkedin-announcement.md

# Minimal Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - social
  - social_override

# Extra Configuration
extra_css:
   - css/extra.css
   - css/mascot.css
extra_javascript: 
   - js/extra.js
copyright: Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.
extra:
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: Introduction to Economics
  textbook_version: "1.0"
  generator: false
  analytics:
    provider: google
    property: G-4GQR1L5GH6
