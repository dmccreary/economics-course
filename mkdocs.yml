# Theme Configuration
theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    - scheme: default
      primary: green
      accent: yellow
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.code.copy

# Minimal Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - social
  - social_override

# Extra Configuration
extra_css:
   - css/extra.css
extra_javascript: 
   - js/extra.js
